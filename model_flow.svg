<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="100%" role="img" aria-label="Model flow: initial conditions at birth, a fixed seven-step cycle each year of age from 0 to 24, then a link at age 25 to the Future Adult Model">
  <style>
    text { font-family: 'Source Sans Pro', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif; fill: #262730; }
    .phase { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; fill: #6B7180; }
    .title { font-size: 14.5px; font-weight: 600; }
    .label { font-size: 12px; font-weight: 600; fill: #4A5060; }
    .body { font-size: 12px; fill: #3A3F4B; }
    .chiptitle { font-size: 13.5px; font-weight: 600; }
    .chipbody { font-size: 11.5px; fill: #4A5060; }
    .age { font-size: 11px; fill: #7A8090; }
    .num { font-size: 12px; font-weight: 600; fill: #3A3F4B; }
    .note { font-size: 12px; fill: #5F6470; }
    .arrowlbl { font-size: 11.5px; fill: #5F6470; font-style: italic; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F6470"/>
    </marker>
  </defs>

  <!-- Phase headers -->
  <text class="phase" x="10" y="26">AT BIRTH</text>
  <text class="phase" x="286" y="26">EACH YEAR OF AGE, 0–24 (STEPS RUN IN ORDER)</text>
  <text class="phase" x="1050" y="26">AGE 25 TO DEATH</text>

  <!-- Birth panel -->
  <rect x="10" y="40" width="236" height="234" rx="10" fill="#EEF2F7" stroke="#A9B6C7"/>
  <text class="title" x="26" y="66">Initial conditions</text>
  <text class="label" x="26" y="92">Fixed</text>
  <text class="body" x="26" y="110">CHD severity, sex, race/ethnicity,</text>
  <text class="body" x="26" y="126">parent education, insurance,</text>
  <text class="body" x="26" y="142">family poverty</text>
  <text class="label" x="26" y="168">Drawn jointly</text>
  <text class="body" x="26" y="186">Developmental delay, intellectual</text>
  <text class="body" x="26" y="202">disability; anxiety, depression,</text>
  <text class="body" x="26" y="218">behavioral problems, each with</text>
  <text class="body" x="26" y="234">an onset age (revealed when the</text>
  <text class="body" x="26" y="250">child reaches it)</text>

  <!-- Yearly loop panel -->
  <rect x="286" y="40" width="708" height="234" rx="10" fill="#F4F5F7" stroke="#C9CED6"/>

  <!-- Chips: x = 300 + i*98, width 92, y 56..186 -->
  <g>
    <!-- 1 Mortality -->
    <rect x="300" y="56" width="92" height="132" rx="8" fill="#FFFFFF" stroke="#C5CBD3"/>
    <circle cx="316" cy="73" r="10" fill="#E6E9EE"/><text class="num" x="316" y="77" text-anchor="middle">1</text>
    <path d="M376,67 l6,6 l-6,6 l-6,-6 z" fill="#2F4B7C"/>
    <text class="chiptitle" x="308" y="104">Mortality</text>
    <text class="chipbody" x="308" y="122">Life table ×</text>
    <text class="chipbody" x="308" y="137">severity risk</text>
    <text class="age" x="308" y="178">ages 0–24</text>

    <!-- 2 Health -->
    <rect x="398" y="56" width="92" height="132" rx="8" fill="#FFFFFF" stroke="#C5CBD3"/>
    <circle cx="414" cy="73" r="10" fill="#E6E9EE"/><text class="num" x="414" y="77" text-anchor="middle">2</text>
    <path d="M474,67 l6,6 l-6,6 l-6,-6 z" fill="#2F4B7C"/>
    <text class="chiptitle" x="406" y="104">Health</text>
    <text class="chipbody" x="406" y="122">Special needs;</text>
    <text class="chipbody" x="406" y="137">conditions</text>
    <text class="chipbody" x="406" y="152">at onset age</text>
    <text class="age" x="406" y="178">ages 0–17</text>

    <!-- 3 Care use -->
    <rect x="496" y="56" width="92" height="132" rx="8" fill="#FFFFFF" stroke="#C5CBD3"/>
    <circle cx="512" cy="73" r="10" fill="#E6E9EE"/><text class="num" x="512" y="77" text-anchor="middle">3</text>
    <text class="chiptitle" x="504" y="104">Care use</text>
    <text class="chipbody" x="504" y="122">ER and</text>
    <text class="chipbody" x="504" y="137">specialist visits</text>
    <text class="age" x="504" y="178">ages 0–17</text>

    <!-- 4 Parents -->
    <rect x="594" y="56" width="92" height="132" rx="8" fill="#FFFFFF" stroke="#C5CBD3"/>
    <circle cx="610" cy="73" r="10" fill="#E6E9EE"/><text class="num" x="610" y="77" text-anchor="middle">4</text>
    <text class="chiptitle" x="602" y="104">Parents</text>
    <text class="chipbody" x="602" y="122">Stopped work;</text>
    <text class="chipbody" x="602" y="137">trouble affording</text>
    <text class="chipbody" x="602" y="152">essentials</text>
    <text class="age" x="602" y="178">ages 0–17</text>

    <!-- 5 Child -->
    <rect x="692" y="56" width="92" height="132" rx="8" fill="#FFFFFF" stroke="#C5CBD3"/>
    <circle cx="708" cy="73" r="10" fill="#E6E9EE"/><text class="num" x="708" y="77" text-anchor="middle">5</text>
    <text class="chiptitle" x="700" y="104">Child</text>
    <text class="chipbody" x="700" y="122">Care access,</text>
    <text class="chipbody" x="700" y="137">exercise, grades,</text>
    <text class="chipbody" x="700" y="152">school absence</text>
    <text class="age" x="700" y="178">ages 0–17</text>

    <!-- 6 Overall health -->
    <rect x="790" y="56" width="92" height="132" rx="8" fill="#FFFFFF" stroke="#C5CBD3"/>
    <circle cx="806" cy="73" r="10" fill="#E6E9EE"/><text class="num" x="806" y="77" text-anchor="middle">6</text>
    <text class="chiptitle" x="798" y="104">QALYs</text>
    <text class="chipbody" x="798" y="122">Self-rated</text>
    <text class="chipbody" x="798" y="137">health, mapped</text>
    <text class="chipbody" x="798" y="152">to QALY weight</text>
    <text class="age" x="798" y="178">ages 0–17</text>

    <!-- 7 Costs -->
    <rect x="888" y="56" width="92" height="132" rx="8" fill="#FFFFFF" stroke="#C5CBD3"/>
    <circle cx="904" cy="73" r="10" fill="#E6E9EE"/><text class="num" x="904" y="77" text-anchor="middle">7</text>
    <text class="chiptitle" x="896" y="104">Costs</text>
    <text class="chipbody" x="896" y="122">Hospital, ED,</text>
    <text class="chipbody" x="896" y="137">clinic use,</text>
    <text class="chipbody" x="896" y="152">then payments</text>
    <text class="age" x="896" y="178">ages 0–24</text>
  </g>

  <!-- Return loop: below chip 7 back to chip 1 -->
  <path d="M934,190 V222 H346 V194" fill="none" stroke="#5F6470" stroke-width="1.6" marker-end="url(#ah)"/>
  <text class="arrowlbl" x="640" y="242" text-anchor="middle">next year of age</text>

  <!-- Birth to step 1 -->
  <line x1="248" y1="122" x2="296" y2="122" stroke="#5F6470" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- Adult column -->
  <rect x="1050" y="40" width="220" height="132" rx="10" fill="#EEF4EF" stroke="#A3B8A8"/>
  <text class="title" x="1066" y="66">Link to adulthood</text>
  <text class="body" x="1066" y="88">Each child alive at 25 is</text>
  <text class="body" x="1066" y="104">matched to PSID adults with a</text>
  <text class="body" x="1066" y="120">childhood heart condition, by</text>
  <text class="body" x="1066" y="136">sex and childhood self-rated</text>
  <text class="body" x="1066" y="152">health (no CHD: adults without)</text>

  <rect x="1050" y="190" width="220" height="84" rx="10" fill="#EEF4EF" stroke="#A3B8A8"/>
  <path d="M1254,201 l6,6 l-6,6 l-6,-6 z" fill="#2F4B7C"/>
  <text class="title" x="1066" y="214">Future Adult Model</text>
  <text class="body" x="1066" y="234">Chronic conditions, mortality,</text>
  <text class="body" x="1066" y="250">work, earnings, disability,</text>
  <text class="body" x="1066" y="266">medical spending, quality of life</text>

  <!-- Loop to adulthood -->
  <line x1="982" y1="106" x2="1046" y2="106" stroke="#5F6470" stroke-width="1.6" marker-end="url(#ah)"/>
  <text class="arrowlbl" x="1022" y="98" text-anchor="middle">at 25</text>
  <!-- Link to FAM -->
  <line x1="1160" y1="174" x2="1160" y2="186" stroke="#5F6470" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- Notes -->
  <path d="M16,298 l6,6 l-6,6 l-6,-6 z" fill="#2F4B7C"/>
  <text class="note" x="30" y="308">Where interventions enter. Childhood: mortality (step 1) and conditions (step 2). Adult: risks in the Future Adult Model.</text>
  <text class="note" x="10" y="330">Each step can use results from earlier steps that year, never later ones, so interventions flow downstream only.</text>
</svg>
